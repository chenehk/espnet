defaults:
  - ../../config
  - _self_

# Every value here is read by builder.py or dataset.py.

# egs2/owsm_v3/s2t1/local/prepare_ami.sh converts ihm_train, ihm_dev and
# ihm_eval; the published dump carries only the first two.
splits:
  - dev
  - train

builder:
  source_env_var: AMI
  # <root>/<meeting>/audio/ holds the recordings and <root>/annotations/ the
  # unpacked ami_public_manual_1.6.1.zip that local/ami_text_prep.sh
  # downloads. Headset-<n> is the ihm microphone, the default of
  # egs2/ami/asr1/local/data.sh; sdm/mdm would need beamforming first.
  annotations_subdir: annotations
  audio_template: "{meeting}/audio/{meeting}.Headset-{channel}.wav"

  # local/ami_ihm_data_prep.sh names each recording AMI_<meeting>_H0<channel>,
  # and kaldi_to_whisper.py then prepends --prefix AMI to it, so every OWSM
  # utterance id carries "AMI" twice.
  recording_prefix: AMI

  # One header read per recording, 687 in all. Not optional in practice: 683
  # headset files are 16 kHz mono PCM_16 but ES2010d's four are stereo (two
  # identical channels), which the read path would hand to the frontend as a
  # two-channel span, so those four become failures and the dump's 100
  # ES2010d rows are not reproduced. The dump's audio for them is unusable
  # anyway: `sox -c 1 -t wavpcm <file>` overrides a stereo header instead of
  # downmixing, so its ES2010d spans were cut from a half-speed timeline --
  # in the dump's own ark, x[::2] of a span correlates 1.00000 with the raw
  # file at half the offset.
  read_headers: true

  # s2t.sh stage 4 keeps a dumped utterance only if it is longer than
  # min_wav_duration, so a packed span at or under this never reached the
  # published data. Three dev spans of 0.10, 0.10 and 0.09 s depend on it.
  min_duration: 0.1

  # local/ami_split_segments.pl cuts a transcriber segment at every `.` or `?`
  # and, when a piece still has more than this many words, recursively at the
  # comma nearest its midpoint.
  max_words_per_segment: 30

  # local/split_{dev,train}.orig verbatim. The corpus metadata cannot stand in
  # for them: meetings.xml marks 20 meetings "development" and 98 "training",
  # and 53 carry no seen_type at all.
  meetings:
