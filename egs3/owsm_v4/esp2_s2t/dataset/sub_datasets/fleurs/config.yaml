defaults:
  - ../../config
  - _self_

# Every value here is read by builder.py or dataset.py.

# The corpus ships a test split too; OWSM prepares only these two.
splits:
  - dev
  - train

builder:
  source_env_var: FLEURS
  # FLEURS is distributed through HuggingFace, so the corpus is that cache
  # rather than a directory of files; prepare_fleurs.py calls load_dataset the
  # same way.
  hf_dataset: google/xtreme_s
  hf_config: fleurs.all
  # validation is OWSM's dev. The corpus' own "test" is not prepared.
  hf_splits:
    dev: validation
    train: train

  # The cached manifest records the paths the corpus had when it was first
  # downloaded, which are not where it lives now. Everything from this marker
  # rightwards is kept and rehung under the current root; upstream skips an
  # example whose audio is missing, so without this every example is skipped.
  path_marker: /downloads/extracted/

  # FLEURS audio is 16 kHz, and num_samples is in the manifest, so no file is
  # opened for its duration.
  samples_per_second: 16000

  # lang_id -> ISO 639-3. prepare_fleurs.py resolves this through the iso639
  # package and then overrides twenty-odd entries by hand, so the result is
  # not recomputable from the lang_id alone: only 10 of these 102 equal the
  # lang_id prefix. Frozen, and cross-checked against the dump -- every one of
  # the 102 appears in dev, and none maps to more than one code across 34,052
  # utterances.
  language_map:
    "af_za": afr
    "am_et": amh
    "ar_eg": ara
